<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Reinforcement Learning{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <h1 class="navbar-brand mb-0">{% block navtitle %}Reinforcement Learning{% endblock %}</h1>
    <span class="text-light">Active Session | v1.0</span>
  </div>
</nav>

{% block content %}{% endblock %}

<div class="container mb-4">
  <a href="/" class="btn btn-secondary">← Return to Menu</a>
</div>

<footer class="text-center text-muted py-3 mt-4">
  © 2026 — Internal data analysis system
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
