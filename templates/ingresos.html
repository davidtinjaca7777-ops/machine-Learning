<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Predicción de Ingresos</title>
  
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='style.css') }}" rel="stylesheet">
  <style>
    
    .card-hover {
      transition: transform 0.2s, filter 0.2s;
    }
    .card-hover:hover {
      transform: translateY(-3px);
      filter: brightness(95%);
    }
    .card-hover:active {
      filter: brightness(85%);
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  
  <nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
      <h1 class="navbar-brand mb-0">Analytics Model Panel</h1>
      <span class="text-light">Active session | v1.0</span>
    </div>
  </nav>

  
  <main class="container mt-4">
    <div class="card card-hover shadow-sm p-4">
      <h1 class="mb-4">Revenue Forecasting</h1>

      <form method="POST" class="mb-3">
        <div class="mb-3">
          <label for="clientes" class="form-label">Number of clients:</label>
          <input type="number" name="clientes" id="clientes" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Predict</button>
      </form>

      {% if prediccion %}
      <div class="alert alert-success mt-4">
        <h2>Estimated Revenue: {{ prediccion | round(2) }}</h2>
        <img src="/static/grafico.png" alt="Regression Chart" class="img-fluid rounded mt-3">
      </div>
      {% endif %}

      <div class="mt-4">
        <a href="/" class="btn btn-secondary">← Return to Menu</a>
      </div>
    </div>
  </main>

  
  <footer class="text-center text-muted py-3 mt-4">
    © 2026 — Internal data analysis system
  </footer>

  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
